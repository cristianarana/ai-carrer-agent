services:
  ai-carrer-agent:
    build: .
    container_name: ai-carrer-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - reports:/app/reports
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  reports: